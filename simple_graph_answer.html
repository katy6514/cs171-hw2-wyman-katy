<!DOCTYPE html>
<meta charset="utf-8">
<title>Homework 2 Graph</title>
<style>
  .link {
    stroke: gray;
    stroke-width: 1.5px;
  }

  .node {
    fill: #66CC66;
    stroke: #000;
    stroke-width: 1px;
  }

  .node:hover {
    fill: red;
  }

</style>
<body>


    <div id="tooltip" class="hidden">
          <img id="avatar" src="">
      <div id = "tooltip_text">
        <h3>Commit Info</h3>
          <p>Sha: <span id="sha"></span></p>
          <p>Author: <span id="author"></span></p>
          <p>Message: <span id="message"></span></p>
          <p>Date: <span id="date"></span></p>
        </div>
    </div>
  <!-- online version of D3 -->
<!-- <script src="http://d3js.org/d3.v3.min.js"></script> -->
  <!-- downloaded version for orking offline -->
<link rel="stylesheet" type="text/css" href="h2.css"></link>
<script src="../d3/d3.js"></script> 

  <form>
  Layout:
    <label><input type="radio" name="layout" value="force" checked> Force</label>
    <label><input type="radio" name="layout" value="random" > Random</label>
    <label><input type="radio" name="layout" value="radial"> Radial</label>  
    <label><input type="radio" name="layout" value="line"> Line</label>
    <label><input type="radio" name="layout" value="line_cat"> Line by Category</label>
    <label><input type="radio" name="layout" value="line_time"> Line by Time</label>
  </form>
  <form>
  Color:
    <label><input type="radio" name="color" value="nocolor" checked> None</label>
    <label><input type="radio" name="color" value="color_cat" > Category</label>
  </form>
  <form>
  Size:
    <label><input type="radio" name="size" value="nosize" checked> None</label>
    <label><input type="radio" name="size" value="size_cat" > Category</label>
  </form>
  <form>
  Time:
    <label><input type="radio" name="size" value="nosize" checked> Index</label>
    <label><input type="radio" name="size" value="size_cat" > Absolute Time</label>
  </form>

<script>

var commitData; 
var branchData;
var nb_nodes;
var padding = 20;
var xScale;

var width = 900,
    height = 700;

var svg = d3.select("body").append("svg")
            .attr("width", width)
            .attr("height", height);

var fill = d3.scale.category10();

var graph = {nodes:[], links:[]};


d3.json("commits_last50_syntagmatic.json", function(error, data){
     if (error) return console.log("error!");
     commitData = data;
     d3.json("branches_syntagmatic.json", function(error, data){
          if (error) return console.log("error!");
          branchData = data;
            // reprocess the date
            for (var i = 0; i < commitData.length;i++) {
              newDate = commitData[i].commit.committer.date;
              commitData[i].commit.committer.date = new Date(newDate);
            }
          build_network();
     });
});


var get_links = function(){
  graph.nodes.map(function(d,i){
    d.parents.map(function(e,j){
      for (var k in graph.nodes){
        if (graph.nodes[k].sha == e.sha) {
          graph.links.push({'source':i,'target':parseInt(k)})
        };
      }
    });
  });
  //build_network();
}

// var get_authors = function(){
//   graph.nodes.map(function(d,i){
//     for (var j in graph.nodes) {
//      // graph.nodes.push({'author':})
//      //console.log(d.commit.author);
//      console.log(d.commit.author.name);
//      //graph.nodes.push(d.commit.author.name);
//     };
//   });
// }

//     return { cat : d.commit.author.name }; 
//   });
// }

var committers =[];


var build_network = function(){

  commitData.map(function(d){
    console.log(d.commit.author)
    graph.nodes.push(d);

  });

  nb_nodes = commitData.length, nb_cat = 10;

  // get committers and make categories based off committer
  // CANT FIGURE THIS OUT
  // iterate through list of all unique users, assign an id# (1,2,3,4, etc...) to them, store in an array?
  // everytime there's a new committer, they get a new id# and y scale of github network is 
      // scaled by that number but I can't figure out how to work with this data.
  // would also assign colors based off users.


  // commiters = 

  // graph.nodes = d3.range(nb_nodes).map(function() {  
  //   return { cat:5 }; 
  // })

  get_links();
 // get_authors();

  // Generate the force layout
  var force = d3.layout.force()
      .size([width, height])
      .charge(-50)
      .linkDistance(10)
      .on("tick", tick)
      .on("start", function(d) {})
      .on("end", function(d) {})


  function tick(d) {
    graph_update(0);
  }

  function random_layout() {
    
    force.stop();

    graph.nodes.forEach(function(d, i) {
      d.x = width/4 + 2*width*Math.random()/4;
      d.y = height/4 + 2*height*Math.random()/4;
    })
    
    graph_update(500);
  }

  function force_layout() {

   force.nodes(graph.nodes)
        .links(graph.links)
        .start();
  }

  function line_layout() {

    force.stop();

    xScale = d3.scale.linear()
                    .domain([0, commitData.length])
                    .range([0, width]);

    graph.nodes.forEach(function(d, i) {
      d.y = height/2;
      d.x = xScale(i)+padding;
    })

    graph_update(500);
  }

  function time_layout(){
    force.stop();

    var maxDate = d3.max(graph.nodes, function(d){return d.commit.committer.date})
    var minDate = d3.min(graph.nodes, function(d){return d.commit.committer.date}) 

   // var maxDate = d3.time.format("%Y-%m-%d").parse("2013-8-26");
    //var minDate = d3.time.format("%Y-%m-%d").parse("2012-10-10");

    xScale = d3.scale.linear()
                    .domain([minDate,maxDate])
                    .range([0, width]);

    graph.nodes.forEach(function(d, i) {
      d.y = height/2;
      //d.x = xScale(d.commit.committer.date)+padding;
      d.x = xScale(d3.time.format("%Y-%m-%d").parse(d.commit.committer.date));
    })

    graph_update(500);
  }

  function line_cat_layout() {

    force.stop();

    graph.nodes.forEach(function(d, i) {
      d.y = height/2 + d.cat*20;
    })

    graph_update(500);
  }

  function radial_layout() {

    force.stop();

    var r = height/2;

    var arc = d3.svg.arc()
            .outerRadius(r);

    var pie = d3.layout.pie()
    .sort(function(a, b) { return a.cat - b.cat;})
            .value(function(d, i) { return 1; }); // equal share for each point

    graph.nodes = pie(graph.nodes).map(function(d, i) {
      d.innerRadius = 0;
      d.outerRadius = r;
      d.data.x = arc.centroid(d)[0]+height/2;
      d.data.y = arc.centroid(d)[1]+width/2;
      d.data.endAngle = d.endAngle; 
      d.data.startAngle = d.startAngle; 
      return d.data;
    })

    graph_update(500);
  }

  function category_color() {
    d3.selectAll("circle").transition().duration(500).style("fill", function(d) { return fill(d.cat); });
  }

  function category_size() {
    d3.selectAll("circle").transition().duration(500).attr("r", function(d) { return Math.sqrt((d.cat+1)*10); });
  }

  function graph_update(delay) {

    link.transition().duration(delay)
        .attr("x1", function(d) { return d.target.x; })
        .attr("y1", function(d) { return d.target.y; })
        .attr("x2", function(d) { return d.source.x; })
        .attr("y2", function(d) { return d.source.y; });

    node.transition().duration(delay)
        .attr("transform", function(d) { 
          return "translate("+d.x+","+d.y+")"; 
        });
  }

  d3.select("input[value=\"force\"]").on("click", force_layout);
  d3.select("input[value=\"random\"]").on("click", random_layout);
  d3.select("input[value=\"line\"]").on("click", line_layout);
  d3.select("input[value=\"line_cat\"]").on("click", line_cat_layout);
  d3.select("input[value=\"line_time\"]").on("click", time_layout);
  d3.select("input[value=\"radial\"]").on("click", radial_layout);

  d3.select("input[value=\"nocolor\"]").on("click", function() {
    d3.selectAll("circle").transition().duration(500).style("fill", "#66CC66");
  })

  d3.select("input[value=\"color_cat\"]").on("click", category_color);

  d3.select("input[value=\"nosize\"]").on("click", function() {
    d3.selectAll("circle").transition().duration(500).attr("r", 5);
  })

  d3.select("input[value=\"size_cat\"]").on("click", category_size);

  var link = svg.selectAll(".link")
                .data(graph.links)
              .enter().append("line")
                .attr("class", "link")

  var node = svg.selectAll(".node")
                .data(graph.nodes)
              .enter()
                .append("g").attr("class", "node");

  var tooltip = d3.select('body')
        .append('div')
        .attr("id","tooltip")
        .style('position','absolute')
        .style('visibility','hidden')
        .text('asdf');

  node.append("circle")
      .attr("r", 5)
         .on("mouseover", function(d) {
          var xPosition = d.x;
          var yPosition = d.y;
          //Create the tooltip label
          d3.select("#tooltip")
            .style("left", xPosition + "px")
            .style("top", yPosition + "px")
            .select("#sha")
              .text(d.sha);
          d3.select("#author")
              .text(d.commit.author.name)
          d3.select("#message")
              .text(d.commit.message)
          d3.select("#avatar")
              .attr("src", d.author.avatar_url)
          d3.select("#date")
              .text(d.commit.author.date.substr(0,10));
          //Show the tooltip
          d3.select("#tooltip").classed("hidden", false);
        })
        .on("mouseout", function() {
          //Hide the tooltip
          d3.select("#tooltip").classed("hidden", true);
        });

  force_layout();
};

</script>
</body>
</html>
